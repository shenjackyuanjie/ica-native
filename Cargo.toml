[package]
name = "ica-native"
version = "0.1.18"
edition = "2024"

[dependencies]
eframe = { version = "0.36", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "wgpu_no_default_features",
] }
egui = "0.36"
egui-system-fonts = "0.36"
egui_extras = { version = "0.36", features = ["file", "http", "svg"] }

anyhow = "1.0"

foldhash = "0.2"
base64 = "0.23"
hex = "0.4"
sha2 = "0.11"
ed25519-dalek = { version = "3.0" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
roxmltree = "0.21"
image = { version = "0.25", default-features = false, features = [
    "bmp",
    "gif",
    "jpeg",
    "png",
    "tiff",
    "webp",
] }
toml = "1.1"

rust_socketio = { git = "https://github.com/shenjackyuanjie/rust-socketio.git", rev = "fa73b3797b7439444532c64eeee106453df9e3db", default-features = false, features = [
    "async",
    "rustls-tls-native-roots",
] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

tokio = { version = "1.53", features = ["full"] }
futures-util = "0.3"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["time", "env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.10"
lru = "0.18"
rfd = "0.17"
arboard = "3.6"
linkify = "0.11"
urlencoding = "2.1"

[target.'cfg(windows)'.dependencies]
wgpu = { version = "30.0", default-features = false, features = ["dx12", "vulkan"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "30.0", default-features = false, features = ["gles", "vulkan"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "30.0", default-features = false, features = ["metal"] }
