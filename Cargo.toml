[package]
name = "ica-native"
version = "0.1.7"
edition = "2024"

[dependencies]
eframe = { version = "0.35.0", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
] }
egui = "0.35.0"
egui_extras = { version = "0.35.0", features = ["file", "http", "svg"] }

anyhow = "1.0.103"

foldhash = "0.2.0"
base64 = "0.22.1"
hex = "0.4.3"
sha2 = "0.11"
ed25519-dalek = { version = "3.0.0" }

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
image = { version = "0.25.10", default-features = false, features = [
    "bmp",
    "gif",
    "jpeg",
    "png",
    "tiff",
    "webp",
] }
toml = "1.1.3"

rust_socketio = { path = "vendor/rust-socketio/socketio", default-features = false, features = [
    "async",
    "rustls-tls-native-roots",
] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }

tokio = { version = "1.52.3", features = ["full"] }
futures-util = "0.3.32"

tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["time", "env-filter"] }
chrono = { version = "0.4.45", features = ["serde"] }
rand = "0.10.2"
lru = "0.18.1"
rfd = "0.17.2"
arboard = "3.6.1"
urlencoding = "2.1.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
] }
