[package]
name = "ica-native"
version = "0.1.16"
edition = "2024"

[dependencies]
eframe = { version = "0.36.1", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "wgpu_no_default_features",
] }
egui = "0.36.1"
egui_extras = { version = "0.36.1", features = ["file", "http", "svg"] }

anyhow = "1.0.104"

foldhash = "0.2.0"
base64 = "0.23.1"
hex = "0.4.3"
sha2 = "0.11"
ed25519-dalek = { version = "3.0.0" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
roxmltree = "0.21.1"
image = { version = "0.25.10", default-features = false, features = [
    "bmp",
    "gif",
    "jpeg",
    "png",
    "tiff",
    "webp",
] }
toml = "1.1.4"

rust_socketio = { git = "https://github.com/shenjackyuanjie/rust-socketio.git", rev = "fa73b3797b7439444532c64eeee106453df9e3db", default-features = false, features = [
    "async",
    "rustls-tls-native-roots",
] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }

tokio = { version = "1.53.1", features = ["full"] }
futures-util = "0.3.34"

tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["time", "env-filter"] }
chrono = { version = "0.4.45", features = ["serde"] }
rand = "0.10.2"
lru = "0.18.3"
rfd = "0.17.2"
arboard = "3.6.1"
linkify = "0.11.0"
urlencoding = "2.1.3"

[target.'cfg(windows)'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["dx12", "vulkan"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["gles", "vulkan"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["metal"] }
