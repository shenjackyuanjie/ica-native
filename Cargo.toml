[package]
name = "ica-native"
version = "0.1.13"
edition = "2024"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "c7537bdf463a998e7ec636adff33b198891e69ed", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "c7537bdf463a998e7ec636adff33b198891e69ed", default-features = false }
gpui_tokio = { git = "https://github.com/zed-industries/zed", rev = "c7537bdf463a998e7ec636adff33b198891e69ed" }
reqwest_client = { git = "https://github.com/zed-industries/zed", rev = "c7537bdf463a998e7ec636adff33b198891e69ed" }
theme = { git = "https://github.com/zed-industries/zed", rev = "c7537bdf463a998e7ec636adff33b198891e69ed" }
ui = { git = "https://github.com/zed-industries/zed", rev = "c7537bdf463a998e7ec636adff33b198891e69ed" }
zed_assets = { package = "assets", git = "https://github.com/zed-industries/zed", rev = "c7537bdf463a998e7ec636adff33b198891e69ed" }

anyhow = "1.0.104"

foldhash = "0.2.0"
base64 = "0.23.1"
hex = "0.4.3"
sha2 = "0.11"
ed25519-dalek = { version = "3.0.0" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
roxmltree = "0.21.1"
image = { version = "0.25.10", default-features = false, features = [
    "bmp",
    "gif",
    "jpeg",
    "png",
    "tiff",
    "webp",
] }
toml = "1.1.4"

rust_socketio = { git = "https://github.com/shenjackyuanjie/rust-socketio.git", rev = "4bdb04f7cb305a724590bcf580dff11df8f6a06b", default-features = false, features = [
    "async",
    "rustls-tls-native-roots",
] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }

tokio = { version = "1.53.1", features = ["full"] }
futures-util = "0.3.33"

tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["time", "env-filter"] }
chrono = { version = "0.4.45", features = ["serde"] }
rand = "0.10.2"
lru = "0.18.2"
rfd = "0.17.2"
arboard = "3.6.1"
linkify = "0.11.0"
urlencoding = "2.1.3"
unicode-segmentation = "1.12.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "c7537bdf463a998e7ec636adff33b198891e69ed", default-features = false, features = [
    "wayland",
    "x11",
] }
